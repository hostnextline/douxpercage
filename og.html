<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Doux Perçage — carte de partage</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..400;1,6..72,200..300&family=Public+Sans:wght@400;500&display=swap">
<style>
  /* La carte est dessinée en 1200×630, puis agrandie 1,75× pour la
     capture : la réduction finale suréchantillonne le texte au lieu de
     l'interpoler. La fenêtre de capture ne pouvant être redimensionnée,
     c'est la page qui s'adapte à elle. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:2100px;height:1103px;overflow:hidden;background:#F0EAE0}
  .carte{
    width:1200px;height:630px;transform:scale(1.75);transform-origin:top left;
    background:#F0EAE0;color:#1C1F1E;
    font-family:"Public Sans",system-ui,sans-serif;
    display:grid;grid-template-columns:1fr 452px;
  }
  .texte{padding:64px 56px 56px 64px;display:flex;flex-direction:column;justify-content:space-between}
  .marque{display:flex;align-items:center;gap:14px;font-family:"Newsreader",serif;font-size:26px;font-weight:400;letter-spacing:-.01em}
  .marque svg{width:21px;height:21px}
  h1{font-family:"Newsreader",serif;font-weight:200;font-size:88px;line-height:.96;letter-spacing:-.038em}
  h1 em{font-style:italic}
  .bas{border-top:1px solid #CFCEC8;padding-top:24px;display:flex;flex-direction:column;gap:8px}
  .bas p{font-size:19px;color:#4A4F4D}
  .bas span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8C9196}
  figure{position:relative;overflow:hidden}
  figure img{width:100%;height:100%;object-fit:cover;object-position:64% 50%;display:block}
  figure::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#F0EAE0 0%,rgba(240,234,224,0) 26%)}
</style>
</head>
<body>
  <div class="carte">
    <div class="texte">
      <div class="marque">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="18.5" r="8" fill="none" stroke="#1C1F1E" stroke-width="2.6"/>
          <circle cx="16" cy="7" r="3.6" fill="#1C1F1E"/>
        </svg>
        Doux Perçage
      </div>
      <h1>L’aiguille,<br><em>en douceur.</em></h1>
      <div class="bas">
        <span>Montréal · Sur rendez-vous</span>
        <p>Perçage à l’aiguille &amp; formation certifiante</p>
      </div>
    </div>
    <figure><img src="assets/hero.jpg" alt=""></figure>
  </div>
</body>
</html>
